spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: order_user
    password: order_pass
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      # O schema pertence ao Flyway. O Hibernate so confere que as entidades
      # batem com as tabelas migradas -- nunca cria nem altera nada.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: SuperSecurePass123
